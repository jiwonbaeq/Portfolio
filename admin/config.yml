backend:
  name: github
  repo: jiwonbaeq/Portfolio
  branch: main

site_url: https://jiwonbaeq.com
media_folder: media
public_folder: /media

collections:
  - name: site
    label: Site
    files:
      - name: projects
        label: Work grid
        file: data/projects.json
        format: json
        fields:
          - name: projects
            label: Projects
            label_singular: Project
            widget: list
            summary: "{{fields.title}}  ·  {{fields.client}}"
            fields:
              - { name: title,  label: Project name, widget: string }
              - { name: client, label: Client,       widget: string, required: false }
              - { name: agency, label: Agency,       widget: string, required: false }
              - { name: poster, label: Still image URL, widget: string, required: false }
              - { name: thumb,  label: Hover loop URL,  widget: string, required: false }
              - { name: vimeo,  label: Vimeo link,      widget: string, required: false }
      - name: contact
        label: Contact page
        file: data/contact.json
        format: json
        fields:
          - { name: portrait,  label: Portrait URL,     widget: string, required: false }
          - { name: bio,       label: Bio,              widget: text }
          - { name: email,     label: Email,            widget: string }
          - { name: instagram, label: Instagram handle, widget: string }
