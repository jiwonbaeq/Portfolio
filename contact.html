<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Jiwon Baeq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#ffffff; --paper:#000000;
    --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --font-head: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0 }
  html,body{ background:var(--paper); color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; min-height:100%; }
  a{ color:inherit; text-decoration:none }
  :focus-visible{ outline:2px solid var(--ink); outline-offset:3px }

  /* Header — identical to the index page */
  .site-head{
    position:fixed; inset:0 0 auto 0; z-index:20;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:22px 26px;
  }
  .wordmark{ font-family:var(--font-head); font-weight:700; font-size:45px; line-height:1; letter-spacing:-.02em; text-transform:uppercase }
  .wordmark span{ display:block; text-transform:none; font-weight:700; font-size:16px; line-height:1.2; letter-spacing:0; margin-top:6px }
  .menu{ display:flex; gap:26px; font-family:var(--font); font-weight:400; font-size:14px; line-height:1; padding-top:calc(45px * .13) }
  .menu a{ position:relative }
  .menu a::after{ content:""; position:absolute; left:0; right:100%; bottom:-3px; height:1px; background:currentColor; transition:right .3s var(--ease) }
  .menu a:hover::after{ right:0 }

  /* Page */
  .contact{
    min-height:100svh;
    display:grid; grid-template-columns:minmax(0, 5fr) minmax(0, 7fr); gap:64px;
    align-items:center;
    padding:140px 26px 80px;
    max-width:1280px; margin:0 auto;
  }
  .portrait{
    aspect-ratio:4/5; width:100%; background:#141414; overflow:hidden;
  }
  .portrait img{ width:100%; height:100%; object-fit:cover; display:block; filter:brightness(.9) }
  .portrait .empty{ width:100%; height:100%; display:grid; place-items:center; color:rgba(255,255,255,.35); font-size:13px; text-align:center; padding:24px }

  .about{ max-width:56ch }
  .about p{ font-size:18px; line-height:1.55; font-weight:300 }
  .about p + p{ margin-top:1.2em }

  .links{ margin-top:48px; display:flex; flex-direction:column; gap:14px; font-size:14px; letter-spacing:.03em; text-transform:uppercase }
  .links a{ display:inline-flex; align-items:baseline; gap:14px; width:max-content; position:relative; padding-bottom:4px }
  .links a::after{ content:""; position:absolute; left:0; right:100%; bottom:0; height:1px; background:currentColor; transition:right .3s var(--ease) }
  .links a:hover::after{ right:0 }
  .links .label{ color:rgba(255,255,255,.5); min-width:82px }

  @media (max-width: 860px){
    .contact{ grid-template-columns:1fr; gap:40px; padding:120px 18px 60px; align-items:start }
    .portrait{ max-width:420px }
  }
  @media (max-width: 720px){
    .site-head{ padding:18px }
    .wordmark{ font-size:30px }
    .wordmark span{ font-size:13px; margin-top:4px }
    .menu{ font-size:12px; padding-top:calc(30px * .13) }
    .about p{ font-size:16px }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important } }
</style>
</head>
<body>

<header class="site-head">
  <a class="wordmark" href="index.html" aria-label="Jiwon Baeq — Director of Photography, home">Jiwon Baeq<span>Director of Photography</span></a>
  <nav class="menu" aria-label="Main">
    <a href="index.html">Work</a>
  </nav>
</header>

<main class="contact">
  <figure class="portrait" id="portrait">
    <div class="empty">Portrait goes here (4:5, ~1200px tall)</div>
  </figure>

  <section class="about">
    <div id="bio"></div>
    <div class="links">
      <a id="emailLink" href="#"><span class="label">Email</span><span id="emailText"></span></a>
      <a id="igLink" href="#" target="_blank" rel="noopener"><span class="label">Instagram</span><span id="igText"></span></a>
    </div>
  </section>
</main>

<script>
  /* Content is edited through the CMS at /admin — lives in data/contact.json. */
  fetch('data/contact.json', { cache: 'no-cache' }).then(r => r.json()).then(c => {
    if (c.portrait) {
      const img = new Image(); img.src = c.portrait; img.alt = 'Jiwon Baeq';
      document.getElementById('portrait').replaceChildren(img);
    }
    const bio = document.getElementById('bio');
    (c.bio || '').split(/\n\s*\n/).forEach(par => {
      if (!par.trim()) return;
      const p = document.createElement('p'); p.textContent = par.trim(); bio.appendChild(p);
    });
    if (c.email) {
      document.getElementById('emailLink').href = 'mailto:' + c.email;
      document.getElementById('emailText').textContent = c.email;
    } else document.getElementById('emailLink').remove();
    if (c.instagram) {
      const h = c.instagram.replace(/^@/, '');
      document.getElementById('igLink').href = 'https://instagram.com/' + h;
      document.getElementById('igText').textContent = '@' + h;
    } else document.getElementById('igLink').remove();
  });
</script>

</body>
</html>
